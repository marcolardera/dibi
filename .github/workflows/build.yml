# Tests and builds dibi for Linux and Windows on every push and pull
# request; the binaries are kept as workflow artifacts. Pushing a tag v*
# also publishes them as a GitHub release (a pre-release if the tag has a
# suffix, as in v0.2.0-rc1).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The binary needs the glibc and Qt (6.4) of the system it is built on,
    # or newer ones.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOFLAGS: -trimpath # as make build, so the tests and the build share the compiled packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-private-dev
      - run: make test
      - run: make build notices
      - name: Package
        run: |
          D=dibi-$(git describe --tags --always --dirty)-linux-amd64
          mkdir "$D"
          cp bin/dibi LICENSE bin/THIRD_PARTY_NOTICES.txt "$D"/
          tar -czf "$D".tar.gz "$D" # tar keeps the executable bit
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dibi-*-linux-amd64.tar.gz

  windows:
    # Cross-compiled in the image of build/windows. MSYS2's current GCC cannot
    # link the prebuilt DuckDB library (see the README).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # the build runs in Docker, with the cache below
      - uses: docker/setup-buildx-action@v3
      # Cached in GitHub: Qt is only rebuilt when the Dockerfile changes.
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # an artifact the release job would download
        with:
          context: build/windows
          tags: dibi-windows-build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            bin/.windows-cache
          key: windows-go-${{ hashFiles('go.sum', 'build/windows/Dockerfile') }}
          restore-keys: windows-go-
      - run: make -o windows-image windows windows-notices # the image is built above
      - name: Package
        run: |
          D=dibi-$(git describe --tags --always --dirty)-windows-amd64
          mkdir "$D"
          cp bin/dibi.exe LICENSE "$D"/
          cp bin/THIRD_PARTY_NOTICES-windows.txt "$D"/THIRD_PARTY_NOTICES.txt
          zip -r "$D".zip "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dibi-*-windows-amd64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Dibi $GITHUB_REF_NAME" --generate-notes $PRE \
            linux/*.tar.gz windows/*.zip
